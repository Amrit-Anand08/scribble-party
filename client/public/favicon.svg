<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Midnight Slate Gradient -->
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Sheen Gradient -->
    <linearGradient id="spBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Stylus Shaft Gradient -->
    <linearGradient id="spShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Scribble Rainbow Gradient -->
    <linearGradient id="spScribble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="32" height="32" rx="7.5" fill="url(#spBg)"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="6.9" stroke="url(#spBorder)" stroke-width="1.2"/>

  <!-- Fluid Scribble Stroke flowing through pencil nib at (15.4, 15.4) -->
  <path d="M 5.5 21 C 8 16, 12 15.5, 15.4 15.6 C 18.5 15.7, 19.5 25, 23 25 C 25 25, 26 23.5, 26.5 21.5" 
        stroke="url(#spScribble)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Precision Angled Stylus / Pencil -->
  <g transform="translate(20, 11) rotate(45)">
    <!-- Eraser / Cap (vibrant rose) -->
    <path d="M -3 -6.5 C -3 -8.5, 3 -8.5, 3 -6.5 L 3 -5 L -3 -5 Z" fill="#f43f5e"/>

    <!-- Ferrule metal ring -->
    <rect x="-3" y="-5" width="6" height="1.6" rx="0.3" fill="#cbd5e1"/>

    <!-- Pencil Shaft -->
    <rect x="-3" y="-3.4" width="6" height="6.6" rx="0.4" fill="url(#spShaft)"/>
    <!-- Facet highlight -->
    <rect x="-1.5" y="-3.4" width="1.6" height="6.6" fill="#ffffff" fill-opacity="0.3"/>

    <!-- Wood collar cone -->
    <polygon points="-3,3.2 3,3.2 0,6.2" fill="#fde68a"/>

    <!-- Graphite Lead Tip touching the scribble stroke -->
    <polygon points="-1.2,4.7 1.2,4.7 0,6.2" fill="#334155"/>
  </g>

  <!-- Creative Sparkle Star (top left) -->
  <path d="M 7.5 6 C 7.5 7.6 6.4 8.5 5 8.5 C 6.4 8.5 7.5 9.4 7.5 11 C 7.5 9.4 8.6 8.5 10 8.5 C 8.6 8.5 7.5 7.6 7.5 6 Z" 
        fill="#facc15"/>
</svg>
