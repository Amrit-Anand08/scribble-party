services:
  # Backend Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: skribbl-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        fromStaticSite:
          name: skribbl-client
          property: url
      - key: MONGO_URI
        sync: false

  # Frontend Static Site (React + Vite)
  - type: static
    name: skribbl-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          name: skribbl-server
          type: web
          property: host
